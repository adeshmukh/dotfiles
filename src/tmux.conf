# ~/.tmux.conf

# Use Ctrl-a as prefix (screen-style)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Open new windows in the current path
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Ctrl-arrow
bind -r C-h resize-pane -L 5
bind -r C-l resize-pane -R 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Enable mouse support
set -g mouse on

# Increase scrollback buffer (large enough to not think about it)
set -g history-limit 100000

# Enter copy mode on mouse wheel scroll — works even when a TUI (e.g. Claude Code)
# is intercepting key input, since mouse events bypass the active program
bind -n WheelUpPane if-shell -F "#{mouse_any_flag}" \
    "send-keys -M" \
    "if -F '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'"

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Use 256 colors
set -g default-terminal "screen-256color"

# Status bar
set -g status-left  "[#S] "
set -g status-right "%Y-%m-%d %H:%M"
set -g status-left-length 20

# Activity notifications
setw -g monitor-activity on
set -g visual-activity off

# Use zsh as default shell
set -g default-shell /bin/zsh
